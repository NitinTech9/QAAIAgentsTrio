name: framework-selftest

# Deterministic half of /qa-selftest (no LLM). Every defect class this guards
# against has shipped before: broken JSON, schema drift, fail-open hooks,
# gate-scanner regressions, dangling references, and v5-era @cypress/grep flags.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: All framework JSON parses
        run: |
          find .claude -name '*.json' -print0 | while IFS= read -r -d '' f; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$f" \
              || { echo "invalid JSON: $f"; exit 1; }
          done
          node -e 'JSON.parse(require("fs").readFileSync("package.json","utf8"))'

      - name: Config shape matches schema requirements
        run: |
          node -e '
          const c=JSON.parse(require("fs").readFileSync(".claude/project-config.json","utf8"));
          const p=c.project; const fail=(m)=>{console.error("config shape: "+m);process.exit(1)};
          if(!p) fail("project missing");
          ["name","testFramework","paths","auth","app","runCommand"].forEach(k=>{if(!(k in p))fail("project."+k+" missing")});
          if(!["cypress","playwright"].includes(p.testFramework)) fail("bad testFramework");
          ["ticketContext","manualCases","apiTests","uiTests","pages","support","fixtures","reports"].forEach(k=>{if(!(k in p.paths))fail("paths."+k+" missing")});
          if(!/\{specFile\}/.test(p.runCommand.headless||"")) fail("runCommand.headless lacks {specFile}");
          const stacks=JSON.parse(require("fs").readFileSync(".claude/stacks/code-patterns.json","utf8"));
          if(p.productCode&&p.productCode.stack&&!(p.productCode.stack in stacks)) fail("productCode.stack not in code-patterns.json");
          console.log("config shape OK");'

      - name: Hook exit-code smoke tests
        run: bash scripts/hook-smoke.sh

      - name: Spec gate scanners (fixture round-trip)
        run: node scripts/gates/__tests__/run.js

      - name: No dangling framework references in .claude markdown
        run: node scripts/check-references.js

      - name: Golden corpus self-consistency (accepted specs satisfy their checklists and the gates)
        run: |
          fail=0
          node scripts/golden-check.js .claude/selftest/specs/good-api-spec.cy.js.fixture .claude/selftest/golden/SELFTEST-1/checklist.md || fail=1
          for d in .claude/selftest/golden/SELFTEST-2 .claude/selftest/golden/SELFTEST-3; do
            node scripts/golden-check.js "$d/accepted-spec.cy.js.fixture" "$d/checklist.md" || fail=1
            node scripts/gates/index.js "$d/accepted-spec.cy.js.fixture" || fail=1
          done
          exit $fail

      - name: Agents reference the canonical protocols (no re-drift)
        run: |
          fail=0
          for f in .claude/agents/*.md; do
            for p in state-and-locks config-read untrusted-content; do
              grep -q "protocols/$p.md" "$f" || { echo "✗ $f does not reference protocols/$p.md"; fail=1; }
            done
          done
          grep -q 'renameSync' .claude/protocols/state-and-locks.md || { echo "✗ atomic snippet missing from state-and-locks.md"; fail=1; }
          grep -q 'protocols/status-assertions.md' .claude/commands/validate-spec.md || { echo "✗ validate-spec.md does not reference protocols/status-assertions.md"; fail=1; }
          grep -q 'status-ambiguous' .claude/protocols/status-assertions.md && grep -q 'clearCookies' .claude/protocols/status-assertions.md || { echo "✗ status-assertions.md lost the escape hatch or fake-unauth trap"; fail=1; }
          # Agent tool allowlists are exact-match: any agent using Atlassian tools must
          # list BOTH server-name prefixes (local `atlassian` + claude.ai `claude_ai_Atlassian`),
          # and the MCP guard matcher must cover both — or agents/guards silently miss.
          for f in .claude/agents/*.md; do
            if grep -q 'mcp__atlassian__' "$f"; then
              grep -q 'mcp__claude_ai_Atlassian__' "$f" || { echo "✗ $f lists mcp__atlassian__ tools without the claude_ai_Atlassian variants"; fail=1; }
            fi
          done
          grep -q 'claude_ai_Atlassian' .claude/settings.json || { echo "✗ settings.json MCP-guard matcher does not cover the claude_ai_Atlassian server name"; fail=1; }
          exit $fail

      - name: Knowledge audit surfaces stale ticket-less suppressions (selftest)
        run: node scripts/knowledge-audit.js --selftest

      - name: Trust boundary referenced by every ticket-context reader
        run: |
          fail=0
          for f in $(grep -l 'config.paths.ticketContext' .claude/commands/*.md); do
            grep -q 'untrusted-content' "$f" || { echo "✗ $f reads ticketContext but never references the untrusted-content rule"; fail=1; }
          done
          for f in .claude/agents/*.md; do
            grep -q 'untrusted-content' "$f" || { echo "✗ $f (agent) lacks the untrusted-content rule"; fail=1; }
          done
          grep -q 'UNTRUSTED_TRACKER_CONTENT' .claude/commands/fetch-ticket.md || { echo "✗ fetch-ticket.md does not emit the data fence"; fail=1; }
          exit $fail

      - name: No v5-era @cypress/grep usage (regression guard)
        run: |
          # `--env grepTags=` (with =) is the executable form; bare `--env grepTags` in prose
          # is the deliberate warning about the v5 pitfall and stays allowed.
          if grep -rnE -- '--env grepTags=|@cypress/grep/src/plugin' .claude; then
            echo "v5-era @cypress/grep usage found — use --expose grepTags and @cypress/grep/plugin"; exit 1
          fi
          echo "no v5-era grep usage"
